:root{--bg:#0a0e17;--card:#151b2b;--card2:#1a2236;--blue:#3b82f6;--green:#10b981;--red:#ef4444;--amber:#f59e0b;--text:#e2e8f0;--text2:#94a3b8;--border:#1e293b;--sw:255px}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:var(--blue);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}

.main{margin-left:var(--sw);padding:24px 32px;min-height:100vh}
.st{font-size:1.4rem;font-weight:600;margin-bottom:4px}.ss{color:var(--text2);font-size:.84rem;margin-bottom:22px}

input,select,textarea{width:100%;padding:8px 11px;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:inherit;font-size:.84rem;margin-bottom:10px;outline:none}

.qb{background:var(--card2);border-radius:11px;padding:22px;text-align:center;margin:14px 0;border:1px solid var(--border)}

.ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px}
.ovt{font-size:3rem;font-weight:700;margin:20px 0;font-variant-numeric:tabular-nums}
.ham{display:none;position:fixed;top:12px;left:12px;z-index:200;background:var(--card);border:1px solid var(--border);border-radius:7px;padding:6px 10px;cursor:pointer;font-size:1.2rem;color:var(--text)}
.modal-bg{position:fixed;inset:0;z-index:10001;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:28px;text-align:center;max-width:340px;width:90%}
.fade-in{animation:fi .35s}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px;max-width:420px;width:100%;text-align:center}
.auth-card h1{color:var(--blue);font-size:1.4rem;margin-bottom:4px}
.auth-card .sub{color:var(--text2);font-size:.8rem;margin-bottom:20px}
.auth-card input{text-align:left}
.auth-card .err{color:var(--red);font-size:.78rem;margin-bottom:10px;min-height:18px}
.auth-card .switch{color:var(--text2);font-size:.8rem;margin-top:14px}
.setup-card{max-width:560px}
.setup-card .step{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px;text-align:left;font-size:.82rem;line-height:1.5;color:var(--text2)}
.setup-card .step b{color:var(--text)}
.loading{display:flex;align-items:center;justify-content:center;min-height:100vh;font-size:1rem;color:var(--text2)}
.sc-item{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border)}
.sc-item:last-child{border-bottom:none}
.sc-item .sc-q{font-size:.85rem;flex:1;margin-right:12px}
@media(max-width:768px){
.sidebar:not(.closed){transform:translateX(0)}.sidebar{transform:translateX(-100%)}
.main{margin-left:0;padding:14px 12px;padding-top:52px}
.ham{display:block}.fg{grid-template-columns:1fr}.sg{grid-template-columns:1fr 1fr}
}

// Firebase
let db=null,auth=null;
function initFirebase(c){try{if(!firebase.apps.length)firebase.initializeApp(c);auth=firebase.auth();db=firebase.firestore();return true;}catch(e){return false;}}
function getUid(){return auth&&auth.currentUser?auth.currentUser.uid:null;}
function userDoc(p){const u=getUid();if(!u||!db)return null;return db.collection("users").doc(u).collection("data").doc(p);}
function userCol(c){const u=getUid();if(!u||!db)return null;return db.collection("users").doc(u).collection(c);}
async function saveData(p,d){const r=userDoc(p);if(r)await r.set(d,{merge:true});}
async function addToCol(c,d){const col=userCol(c);if(col)await col.doc(String(d.id)).set(d);}
async function delFromCol(c,id){const col=userCol(c);if(col)await col.doc(String(id)).delete();}
function listenCol(c,cb){const col=userCol(c);if(!col)return()=>{};return col.orderBy("id","desc").onSnapshot(s=>{const i=[];s.forEach(d=>i.push(d.data()));cb(i);});}
function listenDoc(p,cb,dv){const r=userDoc(p);if(!r)return()=>{};return r.onSnapshot(s=>{cb(s.exists?s.data():dv);});}

}

}

// Daily Scorecard
function DailyScorecard({scorecards,saveSetting,settings}){
  const existing=scorecards.find(s=>s.dt===today());
  const[ans,setAns]=useState(existing?existing.answers:[null,null,null,null,null,null,null]);
  const[lesson,setLesson]=useState(existing?existing.lesson||"":"");
  const[saved,setSaved]=useState(!!existing);
  const score=ans.filter(a=>a===true).length;
  const cls=score>=6?"g":score>=5?"a":"r";
  const submit=async()=>{
    const sc={id:existing?existing.id:nowMs(),dt:today(),answers:ans,score,lesson};
    await addToCol("scorecards",sc);
    const yd=new Date(Date.now()-86400000).toISOString().slice(0,10);
    const lastD=settings.lastScoreDate||"";
    let streak=settings.streak||0;
    if(lastD===yd&&score>=5)streak++;else if(lastD!==today())streak=score>=5?1:0;
    saveSetting({lastScoreDate:today(),streak,lastScore:score});
    setSaved(true);
  };
  const toggle=(i,v)=>{const a=[...ans];a[i]=v;setAns(a);setSaved(false);};
  return(<div className="fade-in">
    <h1 className="st">🏆 Daily Discipline Scorecard</h1>
    <p className="ss">Score yourself honestly. This determines tomorrow.</p>
    <div className="card" style={{textAlign:"center"}}>
      <div className={"score-big "+cls}><div className="sn">{score}/7</div><div className="sl">Discipline Score</div></div>
      {score===7&&<p style={{color:"var(--green)",fontWeight:600}}>⭐ Perfect discipline!</p>}
      {score>=5&&score<7&&<p style={{color:"var(--amber)",fontWeight:600}}>⚠️ Below 6: Reduce risk tomorrow.</p>}
      {score<5&&<p style={{color:"var(--red)",fontWeight:600}}>🛑 Below 5: DO NOT trade tomorrow.</p>}
    </div>
    <div className="card">
      <h3>7-Point Checklist</h3>
      {SC_ITEMS.map((q,i)=>(<div className="sc-item" key={i}>
        <div className="sc-q">{q}</div>
        <div className="yn" style={{marginBottom:0,width:140,flexShrink:0}}>
          <button className={ans[i]===true?"yes":""} onClick={()=>toggle(i,true)}>Yes</button>
          <button className={ans[i]===false?"no":""} onClick={()=>toggle(i,false)}>No</button>
        </div>
      </div>))}
    </div>
    <div className="card">
      <h3>One-Sentence Lesson</h3>
      <textarea placeholder="Most important thing you learned today?" value={lesson} onChange={e=>{setLesson(e.target.value);setSaved(false);}}/>
      <button className="btn bp" style={{width:"100%",padding:10}} onClick={submit}>{saved?"✅ Saved!":"💾 Save Scorecard"}</button>
    </div>
    {score<6&&<div className="warn-ban yellow">⚠️ Score below 6/7: Reduce risk tomorrow.</div>}
    {score<5&&<div className="warn-ban red">🛑 Score below 5/7: DO NOT trade tomorrow.</div>}
  </div>);
}

// Analytics
function Analytics({posttrades,scorecards}){
  const c1R=useRef(null),c2R=useRef(null),ch1=useRef(null),ch2=useRef(null);
  useEffect(()=>{
    if(typeof Chart==="undefined"||!c1R.current)return;
    const emap={};posttrades.forEach(p=>{if(!emap[p.emotion])emap[p.emotion]={w:0,t:0};emap[p.emotion].t++;if(p.result==="Win")emap[p.emotion].w++;});
    const el=Object.keys(emap),er=el.map(k=>Math.round(emap[k].w/emap[k].t*100));
    if(ch1.current)ch1.current.destroy();
    ch1.current=new Chart(c1R.current,{type:"bar",data:{labels:el,datasets:[{label:"Win Rate %",data:er,backgroundColor:"#3b82f6",borderRadius:6}]},
      options:{responsive:true,plugins:{legend:{labels:{color:"#94a3b8"}}},scales:{y:{beginAtZero:true,max:100,ticks:{color:"#94a3b8",callback:v=>v+"%"},grid:{color:"#1e293b"}},x:{ticks:{color:"#94a3b8"},grid:{display:false}}}}});
    const last14=scorecards.slice(0,14).reverse();
    if(ch2.current)ch2.current.destroy();
    ch2.current=new Chart(c2R.current,{type:"bar",data:{labels:last14.map(s=>s.dt.slice(5)),datasets:[{label:"Score /7",data:last14.map(s=>s.score),
      backgroundColor:last14.map(s=>s.score>=6?"#10b981":s.score>=5?"#f59e0b":"#ef4444"),borderRadius:6}]},
      options:{responsive:true,plugins:{legend:{labels:{color:"#94a3b8"}}},scales:{y:{beginAtZero:true,max:7,ticks:{color:"#94a3b8",stepSize:1},grid:{color:"#1e293b"}},x:{ticks:{color:"#94a3b8"},grid:{display:false}}}}});
    return()=>{if(ch1.current)ch1.current.destroy();if(ch2.current)ch2.current.destroy();};
  },[posttrades,scorecards]);
  const tot=posttrades.length,wins=posttrades.filter(p=>p.result==="Win").length;
  const followed=posttrades.filter(p=>p.followed).length;
  return(<div className="fade-in">
    <h1 className="st">📈 Analytics</h1>
    <p className="ss">Your data tells the truth.</p>
    <div className="sg">
      <div className="sc g"><div className="si">🎯</div><div className="sv">{tot?Math.round(wins/tot*100):0}%</div><div className="sl">Win Rate</div></div>
      <div className="sc"><div className="si">⭐</div><div className="sv">{tot?Math.round(followed/tot*100):0}%</div><div className="sl">Rules Followed</div></div>
      <div className="sc a"><div className="si">📊</div><div className="sv">{tot}</div><div className="sl">Total Trades</div></div>
    </div>
    <div className="card"><h3>Win Rate by Emotion</h3><canvas ref={c1R} height="260"/></div>
    <div className="card"><h3>Discipline Score History</h3><canvas ref={c2R} height="260"/></div>
  </div>);
}

    const s=localStorage.getItem("tmg_fb");
    if(!s){setPhase("setup");return;}
    try{const c=JSON.parse(s);if(!initFirebase(c)){setPhase("setup");return;}
      auth.onAuthStateChanged(u=>{if(u){
  if(!u.emailVerified){
    auth.signOut();
    alert("Please verify your email before logging in. Check your inbox.");
    setPhase("auth");
  } else {
    setUser(u);
    setPhase("app");
  }
}else{setPhase("auth");}});
    }catch(e){setPhase("setup");}
  },[]);

  useEffect(()=>{
    if(!user||!db)return;
    const u=[];
    u.push(listenCol("pretrades",setPretrades));
    u.push(listenCol("posttrades",setPosttrades));
    u.push(listenCol("scorecards",setScorecards));
    u.push(listenCol("rules",setRules));
    u.push(listenCol("coolJ",setCoolJ));
    u.push(listenDoc("settings",setSettings,{}));
    return()=>u.forEach(fn=>fn&&fn());
  },[user]);

  const saveSetting=(d)=>saveData("settings",d);
  const nav=(id)=>{setPage(id);if(window.innerWidth<=768)setSidebarOpen(false);};
  const handleEm=(dur)=>{saveSetting({emEnd:nowMs()+dur*1000});setEmModal(false);};

  if(phase==="loading")return <div className="loading">Loading...</div>;
  if(phase==="setup")return <SetupScreen onDone={()=>{auth.onAuthStateChanged(u=>{if(u){setUser(u);setPhase("app");}else setPhase("auth");});}}/>;
  if(phase==="auth")return <AuthScreen/>;

  const P=()=>{switch(page){
    case "dashboard":return <Dashboard onNav={nav} settings={settings} pretrades={pretrades} posttrades={posttrades} scorecards={scorecards}/>;
    case "workflow":return <Workflow/>;
    case "pretrade":return <PreTradeJournal pretrades={pretrades} posttrades={posttrades} onNav={nav}/>;
    case "posttrade":return <PostTradeJournal pretrades={pretrades} posttrades={posttrades}/>;
    case "scorecard":return <DailyScorecard scorecards={scorecards} saveSetting={saveSetting} settings={settings}/>;
    case "rules":return <RulesVault rules={rules} settings={settings} saveSetting={saveSetting}/>;
    case "cooldown":return <CooldownZone coolJ={coolJ}/>;
    case "analytics":return <Analytics posttrades={posttrades} scorecards={scorecards}/>;
    case "history":return <TradeHistory pretrades={pretrades} posttrades={posttrades} scorecards={scorecards}/>;
    default:return <Dashboard onNav={nav} settings={settings} pretrades={pretrades} posttrades={posttrades} scorecards={scorecards}/>;
  }};

  return(<React.Fragment>
    <EmergencyOv s={settings}/>
    <EmergencyModal show={emModal} onClose={()=>setEmModal(false)} onConfirm={handleEm}/>
    <button className="ham" onClick={()=>setSidebarOpen(!sidebarOpen)}>&#9776;</button>
    <nav className={"sidebar"+(sidebarOpen?"":" closed")}>
      <div className="logo"><h2>🛡️ TradeMind</h2><small>Guardian &mdash; V2</small></div>
      <div className="navs">
        {NAV_ITEMS.map(item=>(<div key={item.id} className={"ni"+(page===item.id?" active":"")} onClick={()=>nav(item.id)}>
          <span className="ic">{item.icon}</span>{item.label}
        </div>))}
      </div>
      <div className="ew"><button className="ebtn" onClick={()=>setEmModal(true)}>🚨 EMERGENCY STOP</button></div>
      <div className="user-info">
        <span className="email">{user&&user.email}</span>
        <button className="logout-btn" onClick={()=>auth.signOut()}>Log Out</button>
      </div>
    </nav>
    <main className="main" style={sidebarOpen&&window.innerWidth>768?{}:{marginLeft:0}}><P/></main>
  </React.Fragment>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
